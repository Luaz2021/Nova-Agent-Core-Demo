name: Reporte de Error Esquivado o Solucionado (Napkin Community)
description: Comparte una cagada o error que lograste solucionar o esquivar para incluirlo en la Servilleta Global.
title: "[Fix]: "
labels: ["fix-esquivado", "napkin"]
body:
  - type: markdown
    attributes:
      value: |
        Al compartir un error esquivado, ayudas a que **miles de programadores** no vuelvan a tropezar con la misma piedra.
  - type: dropdown
    id: sistema_operativo
    attributes:
      label: Sistema Operativo donde ocurrio
      options:
        - "Windows 10 / 11"
        - "macOS (Apple Silicon M1/M2/M3/M4)"
        - "macOS (Intel)"
        - "Linux (Ubuntu / Debian)"
        - "Linux (Arch / Fedora)"
    validations:
      required: true
  - type: input
    id: contexto
    attributes:
      label: Contexto (Que estabas haciendo cuando fallo?)
      placeholder: "Ej: Al compilar proyecto de C++ o instalar libreria psycopg2"
    validations:
      required: true
  - type: textarea
    id: causa_raiz
    attributes:
      label: Causa Raiz / El Error
      placeholder: "Pega aqui el mensaje de error o explica por que explotaba."
    validations:
      required: true
  - type: textarea
    id: solucion
    attributes:
      label: Hacer en su lugar (La Solucion que funciono)
      placeholder: "Explica paso a paso o pega el comando exacto que arregla el problema."
    validations:
      required: true
