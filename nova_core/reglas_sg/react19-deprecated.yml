id: react19-forwardref-fc-tsx
language: Tsx
severity: error
message: "React 19: forwardRef y React.FC estan obsoletos; pasa ref como prop directa y tipa props directamente"
rule:
  any:
    - pattern: forwardRef($$$ARGS)
    - pattern: React.forwardRef($$$ARGS)
    - pattern: "const $COMP: React.FC<$$$> = $$$"
    - pattern: "const $COMP: React.FC = $$$"
    - pattern: "const $COMP: FC<$$$> = $$$"
    - pattern: "const $COMP: FC = $$$"
