<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Canvas Video Boilerplate</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12151e;
      --border: #232838;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-4xl bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
    <div class="flex justify-between items-center pb-2 border-b border-[var(--border)]">
      <div>
        <h1 class="text-xl font-bold tracking-tight">Motor de Motion Graphics con Codigo</h1>
        <p class="text-xs text-[var(--text-muted)]">Timeline determinista y exportacion nativa a video</p>
      </div>
      <button id="recordBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs px-4 py-2 rounded-lg transition-all flex items-center gap-2">
        <span id="recordDot" class="w-2 h-2 rounded-full bg-white"></span>
        <span id="recordText">Descargar Video (.webm)</span>
      </button>
    </div>

    <!-- Canvas de Animacion (16:9 / 1280x720) -->
    <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-[var(--border)]">
      <canvas id="motionCanvas" width="1280" height="720" class="w-full h-full block"></canvas>
    </div>

    <!-- Barra de Controles de Reproduccion -->
    <div class="flex flex-col gap-2 pt-2">
      <div class="flex items-center gap-3">
        <span id="timeDisplay" class="text-xs font-mono text-[var(--text-muted)] w-12">00:00</span>
        <input id="timelineScrubber" type="range" min="0" max="1000" value="0" class="w-full accent-blue-500 cursor-pointer">
        <span class="text-xs font-mono text-[var(--text-muted)] w-12 text-right">05:00</span>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <button id="playBtn" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700">Pausar</button>
          <button id="resetBtn" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700">Reiniciar</button>
        </div>
        <div class="text-xs text-[var(--text-muted)] font-mono">1280x720 @ 60 FPS</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("motionCanvas");
    const ctx = canvas.getContext("2d");
    const playBtn = document.getElementById("playBtn");
    const resetBtn = document.getElementById("resetBtn");
    const scrubber = document.getElementById("timelineScrubber");
    const timeDisplay = document.getElementById("timeDisplay");
    const recordBtn = document.getElementById("recordBtn");
    const recordText = document.getElementById("recordText");
    const recordDot = document.getElementById("recordDot");

    const DURATION_SECONDS = 5;
    const DURATION_MS = DURATION_SECONDS * 1000;

    let isPlaying = true;
    let isRecording = false;
    let currentT = 0; // Progreso de 0.0 a 1.0
    let lastTimestamp = performance.now();

    // -------------------------------------------------------------
    // RENDERIZADO DETERMINISTA (Puro e independiente del reloj)
    // -------------------------------------------------------------
    function renderFrame(t, width, height) {
      // 1. Limpieza de fondo con degradado suave
      const grad = ctx.createLinearGradient(0, 0, width, height);
      grad.addColorStop(0, "#08090d");
      grad.addColorStop(1, "#101424");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      // 2. Anillos orbitales animados
      const numRings = 4;
      for (let i = 0; i < numRings; i++) {
        const ringProgress = (t + i / numRings) % 1.0;
        const radius = 60 + ringProgress * 260;
        const alpha = Math.sin(ringProgress * Math.PI) * 0.4;

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(59, 130, 246, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // 3. Nodos en rotacion
      const numNodes = 8;
      const angleOffset = t * Math.PI * 4;
      for (let i = 0; i < numNodes; i++) {
        const angle = angleOffset + (i / numNodes) * Math.PI * 2;
        const dist = 140 + Math.sin(t * Math.PI * 2 + i) * 30;
        const x = centerX + Math.cos(angle) * dist;
        const y = centerY + Math.sin(angle) * dist;

        // Linea conectora
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = "rgba(147, 197, 253, 0.15)";
        ctx.lineWidth = 1;
        ctx.stroke();

        // Punto de nodo
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#60a5fa";
        ctx.shadowColor = "#3b82f6";
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // 4. Nucleo central
      ctx.beginPath();
      ctx.arc(centerX, centerY, 18 + Math.sin(t * Math.PI * 4) * 4, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#60a5fa";
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // -------------------------------------------------------------
    // LOOP DE REPRODUCCION
    // -------------------------------------------------------------
    function update(now) {
      if (isPlaying && !isRecording) {
        const delta = now - lastTimestamp;
        currentT = (currentT + delta / DURATION_MS) % 1.0;
        scrubber.value = Math.floor(currentT * 1000);
        updateTimeText();
        renderFrame(currentT, canvas.width, canvas.height);
      }
      lastTimestamp = now;
      if (!isRecording) {
        requestAnimationFrame(update);
      }
    }

    function updateTimeText() {
      const elapsedSec = (currentT * DURATION_SECONDS).toFixed(1);
      timeDisplay.textContent = `00:0${Math.floor(elapsedSec)}`;
    }

    // -------------------------------------------------------------
    // EVENTOS DE CONTROL
    // -------------------------------------------------------------
    playBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? "Pausar" : "Reproducir";
    });

    resetBtn.addEventListener("click", () => {
      currentT = 0;
      scrubber.value = 0;
      updateTimeText();
      renderFrame(0, canvas.width, canvas.height);
    });

    scrubber.addEventListener("input", (e) => {
      isPlaying = false;
      playBtn.textContent = "Reproducir";
      currentT = e.target.value / 1000;
      updateTimeText();
      renderFrame(currentT, canvas.width, canvas.height);
    });

    // -------------------------------------------------------------
    // GRABACION DIRECTA A VIDEO (.webm)
    // -------------------------------------------------------------
    recordBtn.addEventListener("click", async () => {
      if (isRecording) return;
      isRecording = true;
      isPlaying = false;
      recordBtn.classList.add("bg-red-600");
      recordDot.classList.add("animate-pulse");
      recordText.textContent = "Grabando fotogramas...";

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: "video/webm; codecs=vp9" });
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `motion_code_${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        // Restaurar estado
        isRecording = false;
        isPlaying = true;
        recordBtn.classList.remove("bg-red-600");
        recordDot.classList.remove("animate-pulse");
        recordText.textContent = "Descargar Video (.webm)";
        lastTimestamp = performance.now();
        requestAnimationFrame(update);
      };

      recorder.start();

      // Renderizado cuadro a cuadro determinista durante la duracion exacta
      const totalFrames = 60 * DURATION_SECONDS;
      let frame = 0;

      function captureStep() {
        currentT = frame / totalFrames;
        renderFrame(currentT, canvas.width, canvas.height);
        scrubber.value = Math.floor(currentT * 1000);
        updateTimeText();

        frame++;
        if (frame <= totalFrames) {
          requestAnimationFrame(captureStep);
        } else {
          recorder.stop();
        }
      }

      captureStep();
    });

    // Iniciar
    renderFrame(0, canvas.width, canvas.height);
    requestAnimationFrame(update);
  </script>
</body>
</html>
